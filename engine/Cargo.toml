[package]
name = "acclass"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Full-input ModernBERT nine-head activity classifier with Q8 inference"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27.0"
tree-sitter-bash = "0.25.1"
sha2 = "=0.10.9"
# CPU kernels: int8 GEMM (src/qgemm.rs), fused attention, gelu-gate.
rayon = "1.12"
half = "2.7"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
# Fused kernels (src/metal.rs). Candle's metal feature already pulls in both.
candle-metal-kernels = "0.11"
objc2-metal = "0.3"

[profile.release]
lto = true
codegen-units = 1
